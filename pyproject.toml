[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcgaknn"
version = "0.1.0"
description = "Búsqueda aproximada de perfiles ómicos de TCGA con sketches en streaming"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas", "openpyxl"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
